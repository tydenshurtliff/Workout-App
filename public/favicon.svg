<svg xmlns="http://w3.org" viewBox="0 0 100 100">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>
    
    <!-- Neon Blue/Teal gradient for main plates -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Deep Blue gradient for the center bar connection -->
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052d4" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <!-- Neon Purple/Indigo gradient for the outer accent plate -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>
  </defs>

  <!-- Premium dark background tile matching your UI -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Center Connecting Bar -->
  <rect x="25" y="45" width="50" height="10" rx="5" fill="url(#barBlue)" opacity="0.9"/>

  <!-- LEFT WEIGHTS -->
  <!-- Outer Small Plate (Purple Accent) -->
  <rect x="21" y="32" width="8" height="36" rx="4" fill="url(#neonPurple)"/>
  <!-- Inner Large Plate (Teal/Blue) -->
  <rect x="32" y="22" width="11" height="56" rx="5.5" fill="url(#neonBlue)"/>

  <!-- RIGHT WEIGHTS -->
  <!-- Inner Large Plate (Teal/Blue) -->
  <rect x="57" y="22" width="11" height="56" rx="5.5" fill="url(#neonBlue)"/>
  <!-- Outer Small Plate (Teal/Blue Accent) -->
  <rect x="71" y="32" width="8" height="36" rx="4" fill="url(#neonBlue)"/>
</svg>
