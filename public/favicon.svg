<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052d4" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Dumbbell Center Bar -->
  <rect x="25" y="45" width="50" height="10" rx="5" fill="url(#barBlue)"/>

  <!-- Left Plates -->
  <rect x="21" y="32" width="8" height="36" rx="4" fill="url(#neonPurple)"/>
  <rect x="32" y="22" width="11" height="56" rx="5.5" fill="url(#neonBlue)"/>

  <!-- Right Plates -->
  <rect x="57" y="22" width="11" height="56" rx="5.5" fill="url(#neonBlue)"/>
  <rect x="71" y="32" width="8" height="36" rx="4" fill="url(#neonBlue)"/>
</svg>
